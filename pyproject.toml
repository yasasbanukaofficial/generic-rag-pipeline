[project]
name = "rag-pipeline"
version = "0.1.0"
description = "A simple retrieval-augmented generation pipeline"
readme = "README.md"
authors = [
    { name = "Yasas Banu", email = "yixbinfo@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.10",
    "langchain-chroma>=1.1.0",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "marko>=2.2.5",
]

[project.scripts]
rag-pipeline = "rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
